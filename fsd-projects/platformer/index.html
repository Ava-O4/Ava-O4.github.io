<!DOCTYPE html>
<html>
 <head>
   <meta charset="UTF-8" />
   <title>platformer</title>
   <link href="platformer.css" rel="stylesheet" />
   <script src="https://code.jquery.com/jquery-3.1.0.js"></script>
   <script src="setup.js"></script>
   <script src="helpers.js"></script>
   <script src="platformer.js"></script>
 </head>


 <body id="body">
   <canvas id="canvas" width="1400" height="750"></canvas>
   <div id="landscape" aria-hidden="true">
     <span class="mountain mountain-one"></span>
     <span class="mountain mountain-two"></span>
     <span class="hill hill-one"></span>
     <span class="hill hill-two"></span>
   </div>
   <div id="clouds" aria-hidden="true">
     <span class="cloud cloud-one"></span>
     <span class="cloud cloud-two"></span>
     <span class="cloud cloud-three"></span>
   </div>
   <img id="cannon" src="images/cannon.png" />
   <img id="player" src="images/halle.png" />
   <img id="projectile" src="images/projectile.png" />
   <img src="https://upload.wikimedia.org/wikipedia/commons/b/bd/Test.svg" />


   <!-- 1. Hidden Audio Element -->
 <audio id="bg-music" loop>
   <source src=" " type="audio/mpeg">
 </audio>


 <!-- 2. Browser Autoplay Bypass Script -->
 <script>
   document.addEventListener('click', function() {
     var audio = document.getElementById('bg-music');
     audio.play().catch(function(error) {
       console.log("Playback prevented by browser rules:", error);
     });
   }, { once: true }); // Runs only on the very first click
 </script>
 </body>
</html>
